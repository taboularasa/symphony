name: pr-description-lint

on:
  pull_request:
    types: [opened, edited, reopened, synchronize, ready_for_review]

jobs:
  validate-pr-description:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Validate PR description format
        env:
          PR_BODY_JSON: ${{ toJson(github.event.pull_request.body) }}
        run: |
          body="$(printf '%s' "$PR_BODY_JSON" | jq -r '.')"

          if [ -z "$body" ] || [ "$body" = "null" ]; then
            echo "PR description is required." >&2
            exit 1
          fi

          if printf '%s' "$body" | grep -q '<!--'; then
            echo "Remove placeholder comments from the PR description." >&2
            exit 1
          fi

          for heading in "#### Context" "#### TL;DR" "#### Summary" "#### Alternatives" "#### Test Plan"; do
            if ! printf '%s' "$body" | grep -Fq "$heading"; then
              echo "Missing PR template heading: $heading" >&2
              exit 1
            fi
          done
